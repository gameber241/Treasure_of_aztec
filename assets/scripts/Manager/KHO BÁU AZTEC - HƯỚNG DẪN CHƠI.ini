KHO BÁU AZTEC - HƯỚNG DẪN CHƠI
GIỚI THIỆU CHUNG
Kho Báu Aztec là một trò chơi video slot (xèng) gồm 6 guồng quay, 5 hàng (với một guồng bổ sung phía trên các guồng quay 2, 3, 4 và 5) có Wild Hiện Hoạt và số nhân tăng lên trong cả vòng chơi chính và vòng quay miễn phí.

Trò chơi được chơi với mức cược cơ sở 20 với 2,025 đường - tối đa 32,400 đường, mức cược 1 đến 10 và lượng tiền cược từ 0.02 đến 1.00.

CÀI ĐẶT CƯỢC
Loại tiền tệ trong trò chơi là đ.
Kích Cỡ Cược được đặt bằng bộ chọn "Kích Cỡ Cược".
Mức Cược được đặt bằng bộ chọn "Mức Cược".
Số Tiền Cược được đặt bằng bộ chọn "Số Tiền Cược".
"Ví Tiền Mặt" hiển thị số tiền khả dụng để đặt cược.
"Quay Tự Động" sẽ tự động chơi trò chơi theo số vòng chơi đã chọn.
QUY TẮC TRẢ THƯỞNG
Tổ hợp thắng và trả thưởng được thực hiện theo "Bảng Trả Thưởng".
Tiền thắng theo đường cược sẽ bằng giá trị hiển thị trên "Bảng Trả Thưởng" nhân với kích cỡ cược và mức cược.
Đường cược sẽ thắng nếu các biểu tượng thắng xuất hiện liên tiếp từ guồng ngoài cùng bên trái sang phải.
Tổng số đường cược thắng đối với mỗi biểu tượng sẽ được tính toán bằng cách nhân số biểu tượng thắng liền kề trên mỗi guồng từ guồng ngoài cùng bên trái sang phải.
Tiền trả thưởng biểu tượng thắng sẽ được nhân với số đường cược thắng.
Chiến thắng đồng thời trên các đường cược khác nhau sẽ được cộng dồn.
Sau khi trả thưởng mỗi vòng chơi, tất cả biểu tượng chiến thắng sẽ phát nổ cho phép các biểu tượng ở trên chúng rơi xuống cho vòng chơi mới.
Kết hợp chiến thắng bổ sung sẽ được tính trong mỗi vòng chơi cho đến khi không thể tạo ra kết hợp chiến thắng nào nữa.
Tất cả tiền thắng sẽ hiển thị bằng tiền mặt.
Một số biểu tượng trên các guồng 2, 3, 4 và/hoặc 5 có thể chiếm không gian từ 2 đến 4 biểu tượng và mỗi một biểu tượng trong số này sẽ thể hiện như một biểu tượng khi tính toán trả thưởng.
BIỂU TƯỢNG WILD
Biểu tượng Wild thay thế cho tất cả các biểu tượng trừ các biểu tượng Scatter.
Biểu tượng Wild chỉ xuất hiện trên các guồng 2, 3, 4 và 5.
WILD HIỆN HOẠT
Trong bất kỳ vòng quay nào, một số biểu tượng (ngoại trừ biểu tượng Wild và Scatter) trên các guồng 2, 3, 4 và/hoặc 5 chiếm không gian từ 2 đến 4 biểu tượng có thể có một khung bạc bao quanh nó.
Ở mỗi vòng chơi mới sau khi các biểu tượng mới rơi xuống, bất kỳ biểu tượng khung bạc nào tham gia vào một chiến thắng từ vòng chơi trước sẽ được chuyển hóa thành một biểu tượng được chọn ngẫu nhiên (ngoại trừ biểu tượng Wild và Scatter) với một khung vàng bao quanh nó.
Ở mỗi vòng chơi mới sau khi các biểu tượng mới rơi xuống, bất kỳ biểu tượng khung vàng nào tham gia vào một chiến thắng từ vòng chơi trước sẽ được chuyển đổi thành biểu tượng Wild.
SỐ NHÂN
Khi bắt đầu bất kỳ vòng quay vòng chơi chính nào, số nhân chiến thắng là x1.
Trong bất kỳ vòng quay nào, nếu có nhiều hơn một biểu tượng chiến thắng trên các guồng quay, sau khi các chiến thắng được trả thưởng và các biểu tượng rơi xuống, số nhân chiến thắng sẽ tăng thêm 1.
TÍNH NĂNG VÒNG QUAY MIỄN PHÍ
4 biểu tượng Scatter xuất hiện ở mọi vị trí sẽ kích hoạt Tính năng Vòng quay miễn phí với 10 vòng quay miễn phí. Mỗi biểu tượng Scatter bổ sung sẽ kích hoạt thêm 2 vòng quay miễn phí.
Tính năng Vòng quay miễn phí được chơi ở lượng cược và mức cược giống như vòng quay đã kích hoạt tính năng Vòng quay miễn phí.
Khi bắt đầu Tính năng Vòng quay miễn phí, số nhân chiến thắng là x2.
Trong bất kỳ vòng quay miễn phí nào, nếu có nhiều hơn một biểu tượng chiến thắng trên các guồng quay, sau khi các chiến thắng được trả thưởng và các biểu tượng rơi xuống, số nhân chiến thắng sẽ tăng thêm 2.
Có thể tái kích hoạt Vòng quay miễn phí.
TÍNH NĂNG MUA
Chạm vào nút Tính năng Mua để mở menu Tính năng Mua.
Chạm vào nút Bắt đầu để mua Tính năng Vòng Quay Miễn Phí với giá hiển thị trong menu Tính năng Mua.
VÁN CHƠI CHÍNH
Vòng Quay
Chạm để bắt đầu quay ở Cược Cơ Sở, Kích Cỡ Cược và Mức Cược hiện tại.
Chạm vào nút hoặc khu vực trò chơi trong một vòng quay để dừng guồng.
Chỉ dành cho Phiên bản máy tính để bàn
Nhấn phím <Phím cách> để bắt đầu quay ở Cược Cơ Sở, Kích Cỡ Cược và Mức Cược hiện tại.